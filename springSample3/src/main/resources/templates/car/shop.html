<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
<title>中古車販売システム</title>
<link href="/css/list.css" rel="stylesheet"></link>
<meta charset="utf-8" />
</head>
<body>
    <h1>店舗情報管理</h1>
    <form th:action="@{/shop/id_search}" th:object="${shopInformationRequest}"
        th:method="post">
		<select name="prefectureId">
		   <option value="00">都道府県</option>
		   <option
		      th:each="car : ${prefectures}"
		      th:value="${car.prefectureId}"
		      th:text="${car.prefecture}"></option>
		</select>
		<select name="prefectureId">
			<option value="00">店舗</option>
			<option
			  th:each="car : ${prefectures}"
			  th:value="${car.prefectureId}"
			  th:text="${car.prefecture}"></option>
		</select>
        <br />
        <div>
            <input type="submit" value="検索" style="width: 100px;" />
        </div>
        <br />
    </form>
    <div th:if="${userinfo}">
        <table th:object="${userinfo}">
            <tr>
                <th class="cell_title">名前</th>
                <td th:text="*{name}"></td>
            </tr>
            <tr>
                <th class="cell_title">住所</th>
                <td th:text="*{address}"></td>
            </tr>
            <tr>
                <th class="cell_title">電話番号</th>
                <td th:text="*{phone}"></td>
            </tr>
        </table>
    </div>
</body>
</html>
